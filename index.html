<!--
	build-free ES modules: everything resolves through this importmap.
	orbital-volume is vendored (deploy/vendor.sh refreshes it from the sibling
	checkout) so the site is self-contained; swap the alias back to
	"../orbital-volume/" to live-edit the sibling during library work.
-->
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.148.0/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/",
			"@orbitalfoundation/bus": "https://cdn.jsdelivr.net/npm/@orbitalfoundation/bus@2/index.js",
			"@orbitalfoundation/utils": "https://cdn.jsdelivr.net/npm/@orbitalfoundation/utils@2/index.js",
			"orbital-volume/": "./vendor/orbital-volume/",
			"here/": "./"
		}
	}
</script>

<style>
	html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05070c; touch-action: none; }
	#volume001 { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<div id="volume001"></div>
<script type="module" src="index.js"></script>
</body>
</html>
